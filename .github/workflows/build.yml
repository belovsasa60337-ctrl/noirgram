name: Build Noirgram APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp noirgram.html www/index.html

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Permissions (camera, microphone, vibration)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          cat $M

      - name: App icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os, shutil
          src = Image.open("icon.png").convert("RGBA")
          res = "android/app/src/main/res"
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for d, s in sizes.items():
              im = src.resize((s, s), Image.LANCZOS)
              for n in ("ic_launcher.png","ic_launcher_round.png","ic_launcher_foreground.png"):
                  im.save(f"{res}/mipmap-{d}/{n}")
          shutil.rmtree(f"{res}/mipmap-anydpi-v26", ignore_errors=True)
          PY

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noirgram-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
